<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}Productora Audiovisual en Perú | 4KM Producciones{% endblock %}</title>
    <meta name="description" content="{% block description %}4KM Producciones: Productora audiovisual premium en Lima, Perú. Especialistas en videos corporativos, publicidad comercial, streaming y drones. Historias que trascienden.{% endblock %}">
    <meta name="keywords" content="Productora audiovisual Perú, Producción audiovisual Lima, Video corporativo Perú, Cobertura de eventos, Fotografía profesional, Streaming profesional, Drone Lima">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ request.url }}">

    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:title" content="4KM Producciones | Producción Audiovisual Premium en Perú">
    <meta property="og:description" content="Especialistas en videos corporativos, comerciales y contenido de alta gama. Historias que trascienden.">
    <meta property="og:image" content="{{ url_for('static', filename='img/Logo-img.png') }}">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="4KM Producciones | Historias que trascienden">
    <meta property="twitter:description" content="Estudio de producción audiovisual cinematográfica en Lima, Perú.">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/ICONOPAGE.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "4KM Producciones",
      "image": "{{ url_for('static', filename='img/Logo-img.png') }}",
      "@id": "https://www.4kmproducciones.com/#organization",
      "url": "https://www.4kmproducciones.com/",
      "telephone": "+5192413007",
      "priceRange": "$$$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Av. Javier Prado Este",
        "addressLocality": "Ate Vitarte",
        "addressRegion": "Lima",
        "postalCode": "15023",
        "addressCountry": "PE"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": -12.0850,
        "longitude": -76.9740
      }
    }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body>

    {% include 'partials/_navbar.html' %}

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/_footer.html' %}

    <a href="https://wa.me/51924130007?text=Hola%204KM%20Producciones,%20solicito%20una%20cotización%20para%20un%20proyecto." class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Contacto directo por WhatsApp">
        <svg viewBox="0 0 32 32" class="whatsapp-icon"><path d="M16 2a13 13 0 0 0-11.23 19.53L3 29l7.7-2a13 13 0 1 0 5.3-25zm7.4 18.5c-.3.8-1.7 1.6-2.4 1.7-.6.1-1.3.2-3.7-.7a14.7 14.7 0 0 1-6.1-5.4c-.8-1-1.3-2.3-1.3-3.6a4 4 0 0 1 1.2-3 1.3 1.3 0 0 1 1-.4h.3c.2 0 .5-.1.7.4l1 2.3c.1.2.1.4 0 .6l-.4.6c-.1.2-.3.4-.5.5-.2.2-.4.4-.2.8a10 10 0 0 0 1.8 2.3 8.3 8.3 0 0 0 2.7 1.6c.4.2.6.1.8-.1l.8-1c.2-.3.5-.2.8-.1l2.5 1.2c.3.1.5.3.6.4.1.3.1 1-.2 1.5z" fill="#FFF"/></svg>
    </a>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
